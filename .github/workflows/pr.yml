name: Pull Request

on: [pull_request]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.22.3, 24.x]
        # Angular versions supported by the library's test tooling (jest-preset-angular@17
        # requires Angular >=20 <23). The library source itself is compatible with Angular >= 9
        # via peerDependencies, but only 20-22 can actually be exercised by this test preset.
        angular-version: ['20', '21', '22']
        include:
          # zone.js version that matches each Angular release
          - angular-version: '20'
            zone-version: '0.15'
            rxjs-version: '7'
            typescript-version: '5.8'
          - angular-version: '21'
            zone-version: '0.16'
            rxjs-version: '7'
            typescript-version: '5.9'
          - angular-version: '22'
            zone-version: '0.16'
            rxjs-version: '7'
            typescript-version: '5.9'

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Install Angular ${{ matrix.angular-version }}
        run: |
          npm install \
            @angular/common@${{ matrix.angular-version }} \
            @angular/compiler@${{ matrix.angular-version }} \
            @angular/compiler-cli@${{ matrix.angular-version }} \
            @angular/core@${{ matrix.angular-version }} \
            @angular/platform-browser@${{ matrix.angular-version }} \
            @angular/platform-browser-dynamic@${{ matrix.angular-version }} \
            @angular/router@${{ matrix.angular-version }} \
            zone.js@${{ matrix.zone-version }} \
            rxjs@${{ matrix.rxjs-version }} \
            typescript@${{ matrix.typescript-version }} \
            --legacy-peer-deps
      - run: npm run build --if-present
      - run: npm test
      - name: Upload Code Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
